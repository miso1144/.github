name: SMART MEAL - PostgreSQL Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # 17:00 Vietnam time (UTC+7)

permissions:
  contents: read

concurrency:
  group: smart-meal-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check PostgreSQL 17 client
        run: docker run --rm --entrypoint pg_dump postgres:17 --version

      - name: Create and verify encrypted database backup
        env:
          DATABASE_URL: ${{ secrets.SMART_MEAL_BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.SMART_MEAL_BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$DATABASE_URL"
          test -n "$BACKUP_PASSPHRASE"
          mkdir -p backups

          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          BACKUP_FILE="backups/smart_meal_${TIMESTAMP}.dump"
          ENCRYPTED_FILE="${BACKUP_FILE}.enc"

          # Always remove plaintext, including when a command fails.
          trap 'rm -f "$BACKUP_FILE" backups/backup.dump' EXIT

          # Override the image's server entrypoint and run only pg_dump.
          docker run --rm \
            --entrypoint /bin/sh \
            -e DATABASE_URL \
            -v "$PWD/backups:/backups" \
            postgres:17 \
            -c 'exec pg_dump \
              --dbname="$DATABASE_URL" \
              --format=custom \
              --no-owner \
              --no-acl \
              --file=/backups/backup.dump'

          mv backups/backup.dump "$BACKUP_FILE"
          test -s "$BACKUP_FILE"

          # Verify that pg_restore recognizes the archive before encrypting it.
          docker run --rm \
            --entrypoint pg_restore \
            -v "$PWD/backups:/backups:ro" \
            postgres:17 \
            --list "/backups/$(basename "$BACKUP_FILE")" > /dev/null

          ORIGINAL_SHA256=$(sha256sum "$BACKUP_FILE" | cut -d ' ' -f 1)
          openssl enc -aes-256-cbc \
            -salt -pbkdf2 -iter 200000 \
            -in "$BACKUP_FILE" \
            -out "$ENCRYPTED_FILE" \
            -pass env:BACKUP_PASSPHRASE
          test -s "$ENCRYPTED_FILE"

          # Verify the passphrase can decrypt the archive back to the same bytes.
          DECRYPTED_SHA256=$(openssl enc -d -aes-256-cbc \
            -pbkdf2 -iter 200000 \
            -in "$ENCRYPTED_FILE" \
            -pass env:BACKUP_PASSPHRASE | sha256sum | cut -d ' ' -f 1)
          test "$ORIGINAL_SHA256" = "$DECRYPTED_SHA256"
          rm -f "$BACKUP_FILE"
          echo "Encrypted backup created and verified."

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: smart-meal-backup-${{ github.run_id }}
          path: backups/*.enc
          retention-days: 14
          if-no-files-found: error
